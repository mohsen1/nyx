<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WebGL hero</title>
  <style>
    body { margin: 0; background: #fff; color: #333; font: 16px system-ui, sans-serif; }
    .hero { position: relative; height: 480px; }
    .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .hero h1 { position: relative; text-align: center; padding-top: 180px; color: #444; margin: 0; font-size: 64px; }
  </style>
</head>
<body>
  <section class="hero"><canvas id="webgl" width="1200" height="480"></canvas><h1>The OS for teams</h1></section>
  <script>
    // Asana's three.js hero: a WebGL canvas reads back as transparent once it has been shown.
    const gl = document.getElementById('webgl').getContext('webgl');
    if (gl) { gl.clearColor(1, 1, 1, 1); gl.clear(gl.COLOR_BUFFER_BIT); }
  </script>
</body>
</html>
