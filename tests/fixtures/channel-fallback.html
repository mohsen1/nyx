<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Channel variable with a channel fallback</title>
<style>
  /* IKEA's pattern: the variable is never defined, so the literal channels are the real color. */
  body { margin: 0; background: rgb(var(--colour-neutral-1, 255, 255, 255)); color: rgb(var(--colour-text-and-icon-2, 72, 72, 72)); }
  p { padding: 40px; font: 16px system-ui; }
</style>
</head>
<body><p id="text">Products, Rooms, Deals.</p></body>
</html>
