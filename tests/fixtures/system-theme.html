<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Native system color scheme</title>
  <style>
    body { margin: 0; min-height: 100vh; background: #fff; color: #222; font: 18px system-ui; }
    @media (prefers-color-scheme: dark) {
      body { background: #101418; color: #eee; }
    }
  </style>
</head>
<body><h1>A site with native dark mode</h1><p>Its CSS follows browser appearance without changing any attributes.</p></body>
</html>
