<!doctype html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8">
  <title>Theme switch fixture</title>
  <style>
    body { margin: 0; font: 16px system-ui, sans-serif; }
    main { min-height: 100vh; padding: 24px; }
    html.light main { background: #ffffff; color: #111; }
    html.dark main { background: #101418; color: #eee; }
  </style>
</head>
<body><main id="main">Switches theme with a class on html</main></body>
</html>
