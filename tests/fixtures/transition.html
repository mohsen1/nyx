<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Transitions</title>
  <style>
    html { color: #666; }
    body { margin: 0; padding: 24px; min-height: 100vh; box-sizing: border-box; background: #eef3f4; font: 16px system-ui, sans-serif;
      transition: background-color 0.6s; }
  </style>
</head>
<body>
  <h1>A light page that animates its background color</h1>
  <p>Checking for a built-in dark mode must not read the color halfway through a transition.</p>
  <img src="logo-mixed.svg?delay=2500" alt="" width="40" height="40">
</body>
</html>
