<!doctype html><html><head><meta charset="utf-8"><title>Late shadow root</title>
<style>body { background: #fff; color: #222; font: 16px system-ui; }</style></head>
<body><p>Page text</p>
<script>
  const host = document.createElement('div');
  host.id = 'consent';
  document.body.append(host);
  // Attached after insertion, like consent managers that load their UI asynchronously.
  setTimeout(() => {
    const root = host.attachShadow({ mode: 'open' });
    root.innerHTML = '<style>.panel{background:#fff;color:#333;padding:24px;border:1px solid #ddd}</style><div class="panel" id="panel">Your choices regarding cookies</div>';
  }, 800);
</script></body></html>
