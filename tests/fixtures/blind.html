<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A stylesheet Nyx can neither read nor fetch</title>
  <!-- Apple Support in Safari: the sheet is on another host, without CORS, and the background script has no access to it. -->
  <link rel="stylesheet" href="CROSS_ORIGIN/blind.css?nocors">
</head>
<body>
  <!-- Apple's global nav labels are text drawn as SVG, 77×44. -->
  <a class="wordmark" href="#"><svg width="77" height="44" viewBox="0 0 77 44"><path id="wordmark" fill="currentColor" d="M2 18h72v9H2z"/></svg></a>
  <h1 id="title">Apple Support</h1>
  <div class="card" id="card"><p id="text">Reset your password</p></div>
</body>
</html>
