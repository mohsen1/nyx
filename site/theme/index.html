<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111114" media="(prefers-color-scheme: dark)">
  <title>Nyx Theme</title>
  <meta name="description" content="A shared color theme for Nyx, the open-source dark mode extension for Safari, Chrome, Edge and Firefox.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://azimi.me/nyx/theme/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Nyx">
  <meta property="og:title" content="Shared Nyx theme">
  <meta property="og:description" content="A shared color theme for Nyx, the open-source dark mode extension for Safari, Chrome, Edge and Firefox.">
  <meta property="og:image" content="https://azimi.me/nyx/images/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="../icon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="../icon.png" sizes="256x256" type="image/png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <style>
    :root { --bg: #f5f5f7; --surface: #fff; --text: #1d1d1f; --muted: #6e6e73; --accent: #5b4bdb; color-scheme: light dark; font: 16px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111114; --surface: #1c1c1f; --text: #f2f2f7; --muted: #98989f; --accent: #8e80ff; } }
    body { margin: 0; background: var(--bg); color: var(--text); }
    main { max-width: 560px; margin: 0 auto; padding: 40px 16px; display: grid; gap: 20px; }
    header { display: flex; align-items: center; gap: 12px; }
    header img { width: 48px; height: 48px; border-radius: 11px; }
    h1 { font-size: 22px; margin: 0; }
    .preview { border-radius: 14px; padding: 20px; display: grid; gap: 8px; min-height: 140px; box-shadow: 0 1px 3px rgb(0 0 0 / .2); }
    .preview h2 { margin: 0; font-size: 20px; }
    .preview p { margin: 0; opacity: .85; }
    .preview .img { height: 70px; border-radius: 8px; background: linear-gradient(160deg, #f6b94b, #e0654f 45%, #3c7dd9); }
    .actions { display: grid; gap: 10px; }
    .button { display: block; text-align: center; padding: 12px; border-radius: 10px; background: var(--surface); color: var(--text); text-decoration: none; border: 1px solid rgb(127 127 127 / .3); font: inherit; cursor: pointer; }
    .button.primary { background: var(--accent); color: #fff; border: 0; font-weight: 600; }
    .muted { color: var(--muted); font-size: 14px; margin: 0; }
    code { word-break: break-all; }
  </style>
</head>
<body>
  <main>
    <header><img src="../icon.png" alt="" width="48" height="48"><div><h1 id="title">Theme</h1><p class="muted">Shared theme for Nyx, the open-source dark mode for Safari</p></div></header>
    <div class="preview" id="preview">
      <h2>The Evening Edition</h2>
      <p>A preview of how websites look with this theme.</p>
      <div class="img" id="img"></div>
    </div>
    <div class="actions">
      <button type="button" class="button primary" id="nyx-import" hidden>Add to Nyx</button>
      <a class="button" id="open-app" href="#">Open in the Nyx App</a>
      <a class="button" id="open-noir" href="#">Open in Noir</a>
    </div>
    <p class="muted" id="details"></p>
    <p class="muted">Don’t have Nyx? Get it from <a href="https://github.com/mohsen1/nyx">github.com/mohsen1/nyx</a>. The link format is compatible with Noir’s theme links.</p>
  </main>
  <script>
    const q = new URLSearchParams(location.search);
    const hex = (v, d) => /^#?[0-9a-f]{6}$/i.test(v || '') ? '#' + v.replace('#', '') : d;
    const unit = (v, d) => { let n = parseFloat(v); if (!isFinite(n)) return d; if (n > 1) n /= 100; return Math.min(1, Math.max(0, n)); };
    const name = q.get('name') || 'Untitled Theme';
    const bg = hex(q.get('bg'), '#1c1c1e'), text = hex(q.get('text'), '#e3e3e6');
    const brightness = unit(q.get('imageBrightness'), 1), gray = unit(q.get('imageGrayscale') ?? q.get('grayscale'), 0);
    document.getElementById('title').textContent = name;
    document.title = `${name} – Nyx Theme`;
    const p = document.getElementById('preview');
    p.style.background = bg; p.style.color = text;
    document.getElementById('img').style.filter = `brightness(${brightness}) grayscale(${gray})`;
    document.getElementById('open-app').href = `nyx://theme${location.search}`;
    document.getElementById('open-noir').href = `noir://theme${location.search}`;
    document.getElementById('details').textContent = `Background ${bg.toUpperCase()} · Text ${text.toUpperCase()} · Image brightness ${Math.round(brightness * 100)}%` + (gray ? ` · Grayscale ${Math.round(gray * 100)}%` : '');
  </script>
</body>
</html>
